<title>SOOLOW Reels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+KR:wght@300&display=swap">
<style>
/* Layout: one 9:16 reels frame centred on a slightly deeper ivory ground; a quiet control line beneath. Single light look by choice. */
:root{
  --room:#e9e3d8;      /* page ground around the frame */
  --ivory:#f4efe6;     /* reels background */
  --taupe:#a8977b;     /* SOOLOW brand taupe */
  --deep:#8a7a62;      /* taupe for small type, a step darker */
  --line:#cfc4b2;      /* control borders */
  --ink:#6f6252;       /* control text */
  --serif-en:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --serif-ko:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--serif-en);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stage,.bar{width:min(100%,calc((100vh - 96px) * 9 / 16),540px)}
.stage{aspect-ratio:9/16;max-width:100%;background:var(--ivory);border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(90,70,40,.16)}
.stage svg{display:block;width:100%;height:100%}
.bar{display:flex;align-items:center;gap:12px}
.bar button{appearance:none;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px;letter-spacing:.08em;padding:5px 14px;border-radius:999px;cursor:pointer;min-width:76px}
.bar button:hover{border-color:var(--taupe)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--taupe);outline-offset:2px}
.bar input{flex:1;min-width:0;accent-color:var(--taupe)}
.bar .tc{font-variant-numeric:tabular-nums;font-size:15px;min-width:5.5ch;text-align:right}
.en{font-family:var(--serif-en);font-style:italic;font-weight:300;fill:var(--deep)}
.ko{font-family:var(--serif-ko);font-weight:300;fill:var(--deep)}
.place{font-family:var(--serif-en);font-weight:400;fill:var(--taupe)}
</style>

<div class="stage">
<svg id="sv" viewBox="0 0 1080 1920" role="img" aria-label="술로우 로고 모션: Brew Your Time, 당신의 시간을 빚다">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="44%" r="75%">
      <stop offset="0" stop-color="#f8f4ec"/><stop offset=".7" stop-color="#f3eee5"/><stop offset="1" stop-color="#ebe4d7"/>
    </radialGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfa265"/><stop offset="1" stop-color="#a77c45"/>
    </linearGradient>
    <linearGradient id="sandg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddcfb3"/><stop offset="1" stop-color="#c8b48d"/>
    </linearGradient>
    <clipPath id="clipTop"><path id="holeTop"/></clipPath>
    <clipPath id="clipBot"><path id="holeBot"/></clipPath>
    <clipPath id="clipIn"><ellipse cx="251.7" cy="309.2" rx="214" ry="273"/></clipPath>
    <clipPath id="wmClip" clipPathUnits="userSpaceOnUse"></clipPath>
    <filter id="feather" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <!-- the symbol in four soft-edged parts: ring, left curve, hourglass, right curve -->
    <mask id="mRing" maskUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="720"><g filter="url(#feather)"><rect x="-50" y="-50" width="600" height="720" fill="#fff"/><ellipse cx="251.7" cy="309.2" rx="203" ry="262" fill="#000"/></g></mask>
    <mask id="mL" maskUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="720"><g filter="url(#feather)"><ellipse cx="251.7" cy="309.2" rx="203" ry="262" fill="#fff"/><rect x="198" y="-50" width="400" height="720" fill="#000"/></g></mask>
    <mask id="mC" maskUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="720"><g filter="url(#feather)"><ellipse cx="251.7" cy="309.2" rx="203" ry="262" fill="#fff"/><rect x="-50" y="-50" width="248" height="720" fill="#000"/><rect x="306" y="-50" width="300" height="720" fill="#000"/></g></mask>
    <mask id="mR" maskUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="720"><g filter="url(#feather)"><ellipse cx="251.7" cy="309.2" rx="203" ry="262" fill="#fff"/><rect x="-50" y="-50" width="356" height="720" fill="#000"/></g></mask>
    <!-- comma: a soft brush edge sweeping left to right -->
    <linearGradient id="brush" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mComma" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><rect id="commaWipe" x="0" y="0" width="0" height="300" fill="url(#brush)"/></mask>
  </defs>
  <rect width="1080" height="1920" fill="url(#bgG)"/>

  <g id="symbol"><g id="symTurn">
    <g clip-path="url(#clipTop)"><rect id="sandTop" x="150" y="0" width="210" height="0" fill="url(#sandg)"/></g>
    <g clip-path="url(#clipBot)">
      <path id="liqBot" fill="url(#liq)" opacity="0"/>
      <g id="bubbles" fill="none" stroke="#f6e9cf" stroke-width="1.4"></g>
    </g>
    <line id="stream" stroke="#c4af88" stroke-width="2.2" stroke-linecap="round" opacity="0"/>
    <g id="grains" fill="#bfa982"></g>
    <g id="pRing"><path class="sp" mask="url(#mRing)"/></g>
    <g clip-path="url(#clipIn)">
      <g id="pL"><path class="sp" mask="url(#mL)"/></g>
      <g id="pC"><path class="sp" mask="url(#mC)"/></g>
      <g id="pR"><path class="sp" mask="url(#mR)"/></g>
    </g>
    <path id="symFill" class="sp" opacity="0"/>
  </g></g>

  <g id="wordmark">
    <g id="wmLetters" fill="var(--taupe)" clip-path="url(#wmClip)"></g>
    <g id="commaG" mask="url(#mComma)"><path id="comma" fill="var(--taupe)"/></g>
  </g>

  <g text-anchor="middle">
    <text id="t1" class="en" x="540" y="1420" font-size="64" letter-spacing="2">Brew Your Time</text>
    <text id="t2" class="ko" x="540" y="1500" font-size="38" letter-spacing="10">당신의 시간을 빚다</text>
    <text id="t3" class="en" x="540" y="1420" font-size="48" letter-spacing="2">Brew Your Time</text>
    <text id="t4" class="ko" x="540" y="1482" font-size="30" letter-spacing="9">당신의 시간을 빚다</text>
    <text id="t5" class="place" x="540" y="1740" font-size="26" letter-spacing="14">CHEONGDAM</text>
  </g>
</svg>
</div>

<div class="bar">
  <button id="play" type="button" aria-label="일시정지">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="타임라인">
  <span class="tc" id="tc">0.0s</span>
</div>

<script>
const DATA = __DATA__;
const DUR = 27;
const W = 1080, MX = W / 2;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const set = (el, k, v) => el.setAttribute(k, v);
const op = (id, v) => $(id).setAttribute("opacity", clamp(v).toFixed(3));

/* easing: soft curves only */
const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sio = x => -(Math.cos(Math.PI * x) - 1) / 2;
const qio = x => x < .5 ? 16*x**5 : 1 - (-2*x + 2)**5 / 2;
const qo = x => 1 - (1 - x)**4;
const lerp = (a, b, x) => a + (b - a) * x;
const fadeIO = (t, a, b, c, d) => Math.min(sio(seg(t, a, b)), 1 - sio(seg(t, c, d)));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* geometry */
const SYM_W = 500, SYM_H = 620, SCX = 251.7, SCY = 309.2;
const pick = top => DATA.holes.filter(h => Math.abs(h.bbox[0] + h.bbox[2]/2 - 252) < 20).sort((a, b) => top ? a.bbox[1] - b.bbox[1] : b.bbox[1] - a.bbox[1])[0];
const HT = pick(true), HB = pick(false);
$("holeTop").setAttribute("d", HT.d); $("holeBot").setAttribute("d", HB.d);
const topY0 = HT.bbox[1], topY1 = HT.bbox[1] + HT.bbox[3];
const botY0 = HB.bbox[1], botY1 = HB.bbox[1] + HB.bbox[3];
const CX = HT.bbox[0] + HT.bbox[2] / 2;
const st = $("stream"); set(st, "x1", CX); set(st, "x2", CX);
document.querySelectorAll(".sp").forEach(p => { p.setAttribute("d", DATA.sym.comps[0].d); p.setAttribute("fill", "var(--taupe)"); p.setAttribute("fill-rule", "evenodd"); });

const WM = DATA.wm.comps, COMMA_I = 4, letters = [];
WM.forEach((c, i) => {
  if (i === COMMA_I) { $("comma").setAttribute("d", c.d); return; }
  const p = mk("path", { d: c.d }, $("wmLetters"));
  const r = mk("rect", { x: c.bbox[0] - 8, y: 0, width: c.bbox[2] + 16, height: 0 }, $("wmClip"));
  letters.push({ p, r, b: c.bbox });
});
const CB = WM[COMMA_I].bbox;
set($("commaWipe"), "x", CB[0] - 4); set($("commaWipe"), "y", CB[1] - 30); set($("commaWipe"), "height", CB[3] + 60);
const WM_S = 0.84, WM_X = (W - DATA.wm.w * WM_S) / 2, WM_Y = 1150;

const grains = Array.from({ length: 22 }, () => mk("circle", { r: 1.5 }, $("grains")));
const bubbles = Array.from({ length: 12 }, () => mk("circle", { r: 3 }, $("bubbles")));

/* timeline (s)
 0.5  the oval ring breathes in
 1.6  left curve, hourglass and right curve drift together inside it
 6.0  sand runs, liquor rises       Brew Your Time / 당신의 시간을 빚다
13.0  symbol lifts to the lockup
14.0  S O O L appear one by one
16.9  the comma flows out of the L like a brush stroke, then a held breath
18.9  O W continue
21.0  the hourglass turns over and starts again; CHEONGDAM
25.4  fade for the loop */
const SYM_CY0 = 880, SYM_CY1 = 770, S0 = 1.12, S1 = 0.66;
const T_FLIP = 21.0, T_FLIP_END = 23.6;

function hourglass(t, flowA, flowB, phase) {
  // phase 1: first brew (sand -> liquor). phase 2: after the turn, sand runs again.
  const flow = seg(t, flowA, flowB), fl = sio(flow);
  const topLevel = lerp(topY0 + 28, topY1 + 4, fl);
  set($("sandTop"), "y", topLevel); set($("sandTop"), "height", Math.max(0, topY1 + 10 - topLevel));
  const liqLevel = lerp(botY1 + 2, botY0 + 52, fl);
  const amp = flow > 0 && flow < 1 ? 1.6 : 0.6;
  let d = `M ${CX - 110} ${botY1 + 20} L ${CX - 110} ${liqLevel}`;
  for (let x = -110; x <= 110; x += 10) d += ` L ${CX + x} ${liqLevel + Math.sin(x / 24 + t * 1.6) * amp}`;
  set($("liqBot"), "d", d + ` L ${CX + 110} ${botY1 + 20} Z`);
  const running = flow > 0 && flow < 0.98;
  const runIn = sio(seg(t, flowA, flowA + 0.8));
  op("stream", running ? Math.min(runIn, 1 - seg(flow, .88, .98)) * 0.9 : 0);
  set(st, "y1", topY1 - 6); set(st, "y2", liqLevel);
  grains.forEach((g, i) => {
    const ph = (t * 1.0 + rnd(i)) % 1;
    set(g, "cy", lerp(topY1 - 4, liqLevel, ph)); set(g, "cx", CX + (rnd(i + 9) - .5) * 5 * ph);
    set(g, "opacity", running ? (0.85 * (1 - ph * 0.5) * runIn).toFixed(2) : 0);
  });
  bubbles.forEach((b, i) => {
    const sp = 0.22 + rnd(i + 3) * 0.2;
    const ph = (((t - flowA) * sp + rnd(i + 30)) % 1 + 1) % 1;
    const vis = t > flowA + 0.8 && (botY1 - 8) - (liqLevel + 6) > 20 ? 1 : 0;
    set(b, "cx", CX + (rnd(i + 7) - .5) * 90 * (1 - ph * .3) + Math.sin(ph * 7 + i) * 3);
    set(b, "cy", lerp(botY1 - 8, liqLevel + 6, ph));
    set(b, "r", 1.6 + rnd(i + 11) * 3);
    set(b, "opacity", (vis * Math.sin(Math.PI * ph) * 0.75 * sio(seg(t, flowA + 0.8, flowA + 1.8))).toFixed(2));
  });
}

function render(t) {
  /* symbol assembles from within */
  const ring = sio(seg(t, 0.5, 2.6));
  set($("pRing"), "transform", `translate(${SCX} ${SCY}) scale(${lerp(0.94, 1, ring)}) translate(${-SCX} ${-SCY})`);
  op("pRing", ring);
  const join = qio(seg(t, 1.6, 4.8));
  const jo = sio(seg(t, 1.6, 3.6));
  set($("pL"), "transform", `translate(${(1 - join) * -46} ${(1 - join) * 18})`);
  set($("pR"), "transform", `translate(${(1 - join) * 46} ${(1 - join) * -18})`);
  set($("pC"), "transform", `translate(${SCX} ${SCY}) scale(${lerp(0.82, 1, join)}) translate(${-SCX} ${-SCY})`);
  op("pL", jo); op("pR", jo); op("pC", sio(seg(t, 2.0, 4.0)));
  // seal the seams: hand over to the whole symbol once the parts meet
  const whole = sio(seg(t, 4.6, 5.4));
  op("symFill", whole);
  ["pRing", "pL", "pC", "pR"].forEach(id => { if (whole >= 1) op(id, 0); });

  /* placement */
  const mv = qio(seg(t, 13.0, 15.4));
  const s = lerp(S0, S1, mv), cy = lerp(SYM_CY0, SYM_CY1, mv);
  set($("symbol"), "transform", `translate(${MX - SYM_W * s / 2} ${cy - SYM_H * s / 2}) scale(${s})`);

  /* turning the hourglass over: rotate 180, then reset to 0 with the next brew starting (the shape is symmetric) */
  const turn = qio(seg(t, T_FLIP, T_FLIP_END));
  const ang = t < T_FLIP_END ? 180 * turn : 0;
  set($("symTurn"), "transform", `rotate(${ang} ${SCX} ${SCY})`);

  /* contents */
  if (t < T_FLIP_END) {
    hourglass(t, 6.0, 12.6, 1);
    op("sandTop", sio(seg(t, 5.2, 6.2)));
    op("liqBot", sio(seg(t, 6.0, 6.8)) * (1 - sio(seg(t, T_FLIP, T_FLIP + 1.4))));
    $("bubbles").setAttribute("opacity", (1 - sio(seg(t, T_FLIP, T_FLIP + 1.0))).toFixed(3));
  } else {
    hourglass(t, T_FLIP_END + 0.5, T_FLIP_END + 0.5 + 6.6, 2);
    op("sandTop", sio(seg(t, T_FLIP_END - 0.2, T_FLIP_END + 0.7)));
    op("liqBot", sio(seg(t, T_FLIP_END + 0.6, T_FLIP_END + 1.4)));
    $("bubbles").setAttribute("opacity", 1);
  }

  /* wordmark */
  const wy = WM_Y + (1 - sio(seg(t, 14.0, 16.5))) * 16;
  set($("wordmark"), "transform", `translate(${WM_X} ${wy}) scale(${WM_S})`);
  const starts = [14.0, 14.45, 14.9, 15.35, 18.9, 19.35];
  letters.forEach((L, i) => {
    const p = seg(t, starts[i], starts[i] + 1.6);
    const wipe = qo(p), top = L.b[1] - 12, h = L.b[3] + 24;
    set(L.r, "y", top + h * (1 - wipe)); set(L.r, "height", h * wipe);
    set(L.p, "transform", `translate(0 ${(1 - sio(p)) * 22})`);
    set(L.p, "opacity", sio(seg(t, starts[i], starts[i] + 1.1)).toFixed(3));
  });

  /* comma: flows out of the L stem like ink, left to right */
  const cp = sio(seg(t, 16.9, 18.4));
  set($("commaWipe"), "width", (CB[2] + 40) * cp);
  const ox = CB[0], oy = CB[1] + CB[3] * 0.4;
  set($("comma"), "transform", `translate(${ox} ${oy}) scale(${lerp(0.92, 1, cp)}) translate(${-ox} ${-oy})`);

  /* type */
  op("t1", fadeIO(t, 7.0, 8.6, 11.6, 12.8));
  op("t2", fadeIO(t, 8.2, 9.8, 11.6, 12.8));
  $("t1").setAttribute("transform", `translate(0 ${(1 - sio(seg(t, 7.0, 8.6))) * 12})`);
  $("t2").setAttribute("transform", `translate(0 ${(1 - sio(seg(t, 8.2, 9.8))) * 12})`);
  op("t3", fadeIO(t, 20.6, 22.0, 25.4, 26.6));
  op("t4", fadeIO(t, 21.2, 22.6, 25.4, 26.6));
  op("t5", fadeIO(t, 23.0, 24.4, 25.4, 26.6));

  const out = 1 - sio(seg(t, 25.4, 26.6));
  op("symbol", out); op("wordmark", out);
}

/* playback */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing = !reduce, t0 = performance.now(), tNow = reduce ? 24.5 : 0;
const scrub = $("scrub"), tc = $("tc"), btn = $("play");
function show(t) { render(t); scrub.value = Math.round(t / DUR * 1000); tc.textContent = t.toFixed(1) + "s"; }
function frame(now) { if (playing) { tNow = ((now - t0) / 1000) % DUR; show(tNow); } requestAnimationFrame(frame); }
function setPlaying(p) { playing = p; btn.textContent = p ? "Pause" : "Play"; btn.setAttribute("aria-label", p ? "일시정지" : "재생"); if (p) t0 = performance.now() - tNow * 1000; }
btn.addEventListener("click", () => setPlaying(!playing));
scrub.addEventListener("input", () => { setPlaying(false); tNow = scrub.value / 1000 * DUR; show(tNow); });
setPlaying(playing); show(tNow); requestAnimationFrame(frame);
window.__render = t => { playing = false; render(t); };
</script>
